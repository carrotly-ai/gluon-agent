[project]
name = "gluon-agent"
version = "0.13.0"
description = "AI orchestrator for managing multiple Claude Code agents across projects"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.121,<0.3",
    # Direct Anthropic SDK — used by the witness health classifier and the
    # LLM provider abstraction (Bedrock / Vertex / Foundry / direct API).
    # The [vertex] extra pulls in google-cloud-aiplatform so VertexProvider works.
    "anthropic[vertex]>=0.39.0",
    # Password hashing for the local auth backend (D5 Phase 1).
    # Used only when GLUON_AUTH_ENABLED=true + GLUON_AUTH_BACKEND=local.
    "argon2-cffi>=23.1.0",
    # OIDC client (D5 Phase 3). Used only when GLUON_AUTH_ENABLED=true and
    # GLUON_OIDC_ISSUER is set. Authlib wraps OAuth/OIDC discovery, JWKS-
    # backed ID-token validation, and PKCE/state/nonce handling. itsdangerous
    # is the dep behind Starlette's SessionMiddleware which Authlib uses to
    # carry state+nonce between the redirect and callback.
    "authlib>=1.3.0",
    "itsdangerous>=2.2.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "anyio>=4.14.2,<5",
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0.0",
    "redis[hiredis]>=5.0.0",
    "croniter>=2.0.0",  # Cron expression parsing for heartbeat scheduler
    # Transitive dependency floors for security patches (Dependabot)
    "python-multipart>=0.0.32",  # Multipart parser DoS and boundary/header fixes
    "urllib3>=2.8.0",            # Redirect/header and decompression security fixes
    "mcp>=1.30.0,<2",            # Keep the SDK's v1 API with patched transport security
    "pyjwt[crypto]>=2.15.1,<3",  # Asymmetric-key confusion and claim-validation fixes
    "cryptography>=50.0.2",     # Patched certificate and key parsing
    "joserfc>=1.6.8,<2",         # JWE decompression and JSON parsing limits
    "pyasn1>=0.6.4",            # ASN.1 decoder DoS fixes (Vertex dependency)
    "pydantic-settings>=2.14.2,<3",  # Patched settings-file handling (MCP dependency)
    "starlette>=1.3.1,<2",       # Patched ASGI parsing, also required by core MCP
    "idna>=3.15",                # GHSA-65pc-fj4g-8rjx: idna.encode() bypass of CVE-2024-3651 fix
]

[project.optional-dependencies]
discord = [
    "discord.py>=2.3.0",
    "aiohttp>=3.14.5,<4",  # HTTP parser, decompression, and cookie/path fixes
    "multidict>=6.9.1,<8",  # Items-view reference leak in aiohttp's headers
]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]
all = [
    "discord.py>=2.3.0",
    "aiohttp>=3.14.5,<4",
    "multidict>=6.9.1,<8",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=4.0.0",
    "virtualenv>=21.7.13",  # Patched interpreter discovery used by pre-commit
    "types-PyYAML>=6.0.0",
]

[project.scripts]
gluon = "gluon.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gluon"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
# Disabled strict mode - would require significant type annotation effort
# Enable incrementally as types are added
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

# Per-module overrides for files with complex type issues
[[tool.mypy.overrides]]
module = [
    "gluon.git_manager",
    "gluon.transport.telegram",
    "gluon.transport.discord",
    "gluon.agent",
    "gluon.chat_agent",
    "gluon.web.api",
    "gluon.web.background",
    "gluon.runner",
    "gluon.queue.redis_queue",  # External library typing issues with redis.asyncio
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
