[project]
name = "gluon-agent"
version = "0.9.0"
description = "AI orchestrator for managing multiple Claude Code agents across projects"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1.63",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "anyio>=4.0.0",
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0.0",
    "redis[hiredis]>=5.0.0",
    # Transitive dependency floors for security patches (Dependabot)
    "python-multipart>=0.0.22",  # CVE: arbitrary file write
    "mcp>=1.23.0",               # CVE: DNS rebinding via SSRF
]

[project.optional-dependencies]
discord = [
    "discord.py>=2.3.0",
    "aiohttp>=3.13.3",  # CVE: zip bomb, DoS, cookie/path issues
]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]
all = [
    "discord.py>=2.3.0",
    "aiohttp>=3.13.3",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=4.0.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
gluon = "gluon.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gluon"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
# Disabled strict mode - would require significant type annotation effort
# Enable incrementally as types are added
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

# Per-module overrides for files with complex type issues
[[tool.mypy.overrides]]
module = [
    "gluon.git_manager",
    "gluon.bot",
    "gluon.transport.telegram",
    "gluon.transport.discord",
    "gluon.agent",
    "gluon.chat_agent",
    "gluon.web.api",
    "gluon.runner",
    "gluon.queue.redis_queue",  # External library typing issues with redis.asyncio
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
