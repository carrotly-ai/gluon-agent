name: PR baseline
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@v6
      with:
        version: 0.13.3
        python-version: '3.12'
    - run: uv sync --locked --all-extras
    - run: uv run --locked --all-extras ruff check src tests
    - run: uv run --locked --all-extras pytest tests/test_auth.py tests/test_models.py tests/test_agent_config.py
        tests/test_llm_provider.py tests/test_security_phase3.py tests/test_workspace_env_isolation.py tests/test_store.py
        tests/test_git_manager.py tests/test_dependency_security.py -q
    - name: API authentication and authorization
      run: uv run --locked --all-extras pytest tests/test_api_auth.py tests/test_api_authz.py -q
    - name: Readiness and campaign safety
      run: uv run --locked --all-extras pytest tests/test_health_and_concurrency.py
        tests/test_store_durability.py tests/test_api_merge_queue_witness.py tests/test_auto_resume_ceiling.py
        tests/test_api_public_contracts.py tests/test_telegram_questions.py tests/test_discord_channel_routing.py
        tests/conformance -q
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - run: bun install --frozen-lockfile
      working-directory: web-ui
    - run: bun run check
      working-directory: web-ui
    - run: bun run test
      working-directory: web-ui
    - run: bun run build
      working-directory: web-ui
  dependencies:
    name: Application dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@v6
      with:
        version: 0.13.3
        python-version: '3.12'
    - name: Audit all Python extras
      run: |
        uv export --locked --all-extras --no-emit-project --format requirements-txt --output-file /tmp/requirements.txt
        uvx pip-audit==2.10.1 -r /tmp/requirements.txt --no-deps --disable-pip
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Audit both web dependency graphs
      working-directory: web-ui
      run: |
        npm ci --ignore-scripts
        npm audit --package-lock-only
        bun audit
  status:
    name: pr-check
    needs:
    - backend
    - web
    - dependencies
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
    - run: |-
        test "${{ needs.backend.result }}" = success
        test "${{ needs.web.result }}" = success
        test "${{ needs.dependencies.result }}" = success
  diagnostics:
    name: Full backend diagnostics (manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_backend }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@v6
      with:
        version: 0.13.3
        python-version: '3.12'
    - run: uv sync --locked --all-extras
    - run: uv run --locked --all-extras pytest tests -q
on:
  pull_request: {}
  workflow_dispatch:
    inputs:
      full_backend:
        description: Run the slow full backend diagnostic suite
        type: boolean
        default: false
