version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 2
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]
      python-maintenance:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: bun
    directory: /web-ui
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      web-bun-security:
        applies-to: security-updates
        patterns: ["*"]
      web-bun-maintenance:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web-ui
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      web-npm-security:
        applies-to: security-updates
        patterns: ["*"]
      web-npm-maintenance:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /tooling/vercel
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      tooling-security:
        applies-to: security-updates
        patterns: ["*"]
      tooling-maintenance:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
