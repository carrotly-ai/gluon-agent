# Loop SKU (loop-first pivot Phase B). Watches open PRs and shepherds them:
# CI failures, review feedback, merge conflicts. High-frequency pattern — run
# on demand or via a schedule. Default L2: it authors the shepherding plan and
# pauses for approval. Run: gluon formula run pr-babysitter <project>
name: pr-babysitter
kind: loop
description: "Shepherd open PRs: fix CI, address review comments, resolve conflicts (L2 assisted by default)"
variables:
  - name: scope
    type: string
    required: false
    default: "all open PRs authored by this repo's agents or maintainers"
    help: "Which PRs to babysit"
  - name: autonomy
    type: string
    required: false
    default: "L2"
    help: "L1 report-only / L2 assisted / L3 unattended"
objective: |
  Get this repository's open pull requests ({{scope}}) to a mergeable state.

  Survey with `gh pr list` + `gh pr checks <n>` + `gh pr view <n> --comments`.
  Author one task per PR that needs work: failing CI (include the failing
  check names), unresolved review comments (quote them), or merge conflicts.
  Each task must state its PR number and what "mergeable" means for it. Do
  NOT merge anything — mergeable, not merged, is the goal. Complete when
  every in-scope PR is green, conflict-free, and review-addressed.
agent_verifier: true
max_iterations: 15
max_cost_usd: 20.0
profile: standard
use_worktree: true
autonomy: "{{autonomy}}"
