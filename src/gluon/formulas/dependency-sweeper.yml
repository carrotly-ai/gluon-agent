# Loop SKU (loop-first pivot Phase B). Patch-level dependency updates, one
# dependency per task, each gated on the test suite. Default L2.
# Run: gluon formula run dependency-sweeper <project> --var verify="<test cmd>"
name: dependency-sweeper
kind: loop
description: "Update outdated dependencies patch-by-patch, each gated on tests (L2 assisted by default)"
variables:
  - name: verify
    type: string
    required: false
    default: "uv run pytest -q"
    help: "Gate command every update task must pass"
  - name: autonomy
    type: string
    required: false
    default: "L2"
    help: "L1 report-only / L2 assisted / L3 unattended"
objective: |
  Bring this project's dependencies up to date, safely.

  Survey the dependency manifests and enumerate outdated packages (their
  ecosystem tooling: pip/uv, npm/bun, cargo...). Author one task per
  dependency (or per tightly-coupled group), preferring patch/minor bumps;
  call out major bumps in a separate task that only ASSESSES the breaking
  changes. Every update task gets verify_cmd `{{verify}}`. Complete when
  in-scope dependencies are current and the suite passes.
verify_cmd: "{{verify}}"
agent_verifier: false
max_iterations: 15
max_cost_usd: 15.0
profile: standard
use_worktree: true
autonomy: "{{autonomy}}"
# SKU operating metadata (loop-hardening Phase F4) — informational.
cadence: "6h-1d"
risk: medium
week_one_autonomy: L2
cost_model:
  tokens_noop: 3000
  tokens_report: 50000
  tokens_action: 200000
  suggested_daily_cap: 800000
